name: Build and smoke-test artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: docker build --platform linux/amd64 -t paper-artifact .
      - run: docker run --rm --network none paper-artifact smoke
      - run: docker run --rm --network none paper-artifact prepare --sources-only --module all
